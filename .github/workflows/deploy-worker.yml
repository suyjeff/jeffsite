name: Deploy shared-link worker

# The Cloudflare Worker behind shared grades and Power Rank link previews (workers/grades). The site itself deploys
# from deploy.yml; this only runs when the worker's own files change, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'workers/grades/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/grades
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A repo without the token (a fork, or before it is set up) skips quietly instead of failing every push.
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the worker was not deployed. See workers/grades/README.md."
          fi

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/grades/package-lock.json

      # From the lockfile, so the wrangler that deploys is the one that was tested (pinned in package.json).
      - name: Install
        if: steps.token.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy

name: Fantasy scoring accuracy

# Every Tuesday, once Monday night's game is in: checks the fantasy app's scoring against Sleeper's live API for the
# leagues in tests/accuracy/leagues.json (actual points to the cent, projections with no league-scored key left out,
# Sleeper's default half-PPR reproduced). A failing run names every player and team that differs.
on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check scoring against Sleeper
        run: npm run test:accuracy

      - name: Flag the failure
        if: failure()
        run: echo "::error title=Fantasy scoring drifted from Sleeper::See the failing assertions above for every player and team whose points differ."

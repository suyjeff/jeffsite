name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20.9.0"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The shared-grades worker (workers/grades). Unset, grades stay in each browser.
          NEXT_PUBLIC_FF_GRADES_URL: ${{ vars.FF_GRADES_URL || secrets.FF_GRADES_URL }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: sujeff.com
